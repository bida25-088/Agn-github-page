<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Confirmation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .message-box {
      border: 1px solid #ccc;
      padding: 20px;
      display: inline-block;
      background: #f9f9f9;
      border-radius: 8px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h2>✅ Thank You for Your Feedback!</h2>
    <p>Elite Travels appreciates your support which helps us improve our services.</p>
    <button onclick="window.location.href='index.html'">OK</button>
  </div>
</body>
</html>
